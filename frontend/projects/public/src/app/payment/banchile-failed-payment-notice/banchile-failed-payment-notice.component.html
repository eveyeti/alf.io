<div *ngIf="failed" class="alert alert-warning d-flex align-items-start mb-4" role="alert">
  <fa-icon [icon]="['fas', 'exclamation-triangle']" class="me-2 mt-1" a11yRole="presentation"></fa-icon>
  <div>
    <div class="failed-attempt-text">{{ textKey | translate }}</div>
    <div *ngIf="bankDetail" class="failed-attempt-bank-detail mt-1 small">{{ bankDetailKey | translate: {'0': bankDetail} }}</div>
  </div>
</div>
